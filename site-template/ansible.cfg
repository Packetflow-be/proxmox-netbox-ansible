# The Makefile exports ANSIBLE_CONFIG=$(CURDIR)/ansible.cfg, because the dev
# venv sets ANSIBLE_CONFIG globally and would otherwise win.
[defaults]
inventory = inventory/netbox.yml
collections_path = ./.collections
vars_plugins_enabled = host_group_vars,community.sops.sops
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
# New VMs have new host keys: accept unknown keys, still refuse changed ones.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
