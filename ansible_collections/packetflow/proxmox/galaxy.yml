---
namespace: packetflow
name: proxmox
version: 0.5.12
readme: README.md
authors:
  - Packetflow (@Packetflow-be)
description: >-
  Proxmox VE VMs from NetBox: the VM template (cloud image, customized with virt-customize)
  and the VMs themselves (plan, then clone, configure, resize, start, stop).
license:
  - Apache-2.0
tags: [infrastructure, proxmox]
# Runtime dependencies. requirements.yml mirrors these plus dev/test-only
# collections (molecule's docker driver etc.).
dependencies:
  community.general: ">=10.0.0,<14.0.0"
  community.proxmox: ">=1.0.0,<3.0.0"
  netbox.netbox: ">=3.0.0,<4.0.0"
repository: https://github.com/packetflow-be/proxmox-netbox-ansible
documentation: https://github.com/packetflow-be/proxmox-netbox-ansible/tree/main/ansible_collections/packetflow/proxmox
issues: https://github.com/packetflow-be/proxmox-netbox-ansible/issues
build_ignore:
  - "*.tar.gz"
  - .ansible-lint
  - .yamllint
  - .gitignore
  - requirements.yml
  - tests/molecule
  - roles/*/molecule
