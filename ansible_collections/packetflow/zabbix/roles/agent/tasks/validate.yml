---
- name: Check agent settings
  ansible.builtin.assert:
    that:
      - zabbix_agent_server is match('^[A-Za-z0-9.-]+$')
      - zabbix_agent_psk_identity | length > 0
      - zabbix_agent_psk is match('^[0-9a-fA-F]{32,}$')
    fail_msg: >-
      zabbix_agent_server must be a host name, and zabbix_agent_psk_identity and
      zabbix_agent_psk (at least 32 hex characters: openssl rand -hex 32) must be
      set in the site's group_vars/all/secrets.sops.yml.
    quiet: true
