dependencies: {}
repository: https://github.com/Packetflow-be/proxmox-netbox-ansible
documentation: https://github.com/Packetflow-be/proxmox-netbox-ansible/tree/main/ansible_collections/packetflow/services
issues: https://github.com/Packetflow-be/proxmox-netbox-ansible/issues
build_ignore:
  - "*.tar.gz"
  - .ansible-lint
  - .yamllint
  - .gitignore
  - requirements.yml
  - tests/molecule
  - roles/*/molecule
