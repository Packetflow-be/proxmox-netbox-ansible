---
- name: Check services
  vars:
    haproxy_names: "{{ haproxy_services | map(attribute='name', default='') | list }}"
    haproxy_hosts: "{{ haproxy_services | map(attribute='hosts', default=[]) | flatten | map('lower') | list }}"
  ansible.builtin.assert:
    that:
      - haproxy_certificates | length > 0
      - haproxy_names | select('match', '^[a-z0-9_-]+$') | list | length == haproxy_names | length
      - haproxy_names | unique | length == haproxy_names | length
      - "'unknown_host' not in haproxy_names"
      - haproxy_hosts | unique | length == haproxy_hosts | length
      - haproxy_services | map(attribute='hosts', default=[]) | map('length') | select('equalto', 0) | list | length == 0
      - haproxy_services | map(attribute='servers', default=[]) | map('length') | select('equalto', 0) | list | length == 0
    fail_msg: >-
      haproxy_services: every entry needs a unique name ([a-z0-9_-], not unknown_host), at least one
      host and one server, and a host name may belong to one service only. haproxy_certificates
      can't be empty.
    quiet: true

- name: Packages
  ansible.builtin.apt:
    name: [haproxy, openssl]
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Certificate directory
  ansible.builtin.file:
    path: "{{ haproxy_cert_dir }}"
    state: directory
    owner: root
    group: haproxy
    mode: "0750"
  become: true

# Only where no certificate exists yet; certbot's deploy hook overwrites it.
- name: Self-signed placeholders for missing certificates
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      d=$(mktemp -d); trap 'rm -rf "$d"' EXIT;
      openssl req -x509 -nodes -days {{ haproxy_placeholder_days }}
      -newkey ec -pkeyopt ec_paramgen_curve:prime256v1
      -subj "/CN={{ item | basename | regex_replace('\.pem$', '') }}"
      -keyout "$d/key" -out "$d/crt" 2>/dev/null;
      install -d -m 0750 -g haproxy "$(dirname {{ item | quote }})";
      cat "$d/crt" "$d/key" | install -m 0600 /dev/stdin {{ item | quote }}
    executable: /bin/bash
    creates: "{{ item }}"
  loop: "{{ haproxy_certificates }}"
  notify: Reload haproxy
  become: true

- name: Certificate list and host map
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/haproxy/{{ item }}"
    owner: root
    group: haproxy
    mode: "0640"
  loop: [crt-list.txt, hosts.map]
  notify: Reload haproxy
  become: true

- name: Configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: haproxy
    mode: "0640"
    validate: haproxy -c -f %s
  notify: Reload haproxy
  become: true

- name: HAProxy enabled and running
  ansible.builtin.systemd_service:
    name: haproxy
    state: started
    enabled: true
  become: true

- name: Apply reloads now
  ansible.builtin.meta: flush_handlers

- name: HAProxy listens on 443
  ansible.builtin.wait_for:
    port: 443
    timeout: 30
